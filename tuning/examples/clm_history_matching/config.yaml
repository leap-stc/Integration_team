# CLM history-matching example (DRAFT — see README.md).
component: clm
sampler: history_matching
runner: derecho

# history matching
n: 100          # parameter sets per wave
waves: 3

# CLM component — paths on your machine
clm:
  paramranges_csv: ctsm6lhc_paramranges.csv        # from ctsm6_ppe/gen_paramfiles
  base_paramfile: /glade/work/you/ctsm60_params.nc
  history_var: GPP

# Derecho runner
derecho:
  base_case: /glade/work/you/ctsm_basecase         # prebuilt (case.build done)
  output_root: /glade/derecho/scratch/you/ppe
  project: P00000000

# observations to calibrate toward (length must match compute_metrics output)
observations:
  targets: [3.0]
  uncertainty: [0.5]
